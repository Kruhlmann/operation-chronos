# Configuration for cargo-deny: https://embarkstudios.github.io/cargo-deny/
[advisories]
version = 2
yanked = "deny"
ignore = [
    # `paste` is unmaintained. Pulled in transitively via image -> exr/rav1e.
    # No safe upgrade available; not a vulnerability. Re-evaluate when `image`
    # drops it. https://rustsec.org/advisories/RUSTSEC-2024-0436
    "RUSTSEC-2024-0436",
    # `ttf-parser` is unmaintained. Pulled in transitively via
    # winit -> sctk-adwaita (Wayland client-side decorations). No safe upgrade
    # available; not a vulnerability. Re-evaluate when `winit` migrates.
    # https://rustsec.org/advisories/RUSTSEC-2026-0192
    "RUSTSEC-2026-0192",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path dependencies resolve to version "*"; don't flag those.
allow-wildcard-paths = true

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "NCSA",
]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

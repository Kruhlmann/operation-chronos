# Configuration for cargo-deny: https://embarkstudios.github.io/cargo-deny/
[advisories]
version = 2
yanked = "deny"
ignore = [
    # `paste` is unmaintained. Pulled in transitively via image -> exr/rav1e.
    "RUSTSEC-2024-0436",
    # `ttf-parser` is unmaintained. Pulled in transitively via
    # winit -> sctk-adwaita 
    # https://rustsec.org/advisories/RUSTSEC-2026-0192
    "RUSTSEC-2026-0192",
    # `atomic-polyfill` is unmaintained (successor: `portable-atomic`).
    # Pulled in transitively via postcard -> heapless 0.7. Not usable directly
    # by us; will resolve when heapless upgrades.
    # https://rustsec.org/advisories/RUSTSEC-2023-0089
    "RUSTSEC-2023-0089",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path dependencies resolve to version "*"; don't flag those.
allow-wildcard-paths = true

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "NCSA",
]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

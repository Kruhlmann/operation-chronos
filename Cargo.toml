[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
world.path = "crates/world"
gfx.path = "crates/gfx"
launcher.path = "crates/launcher"

bytemuck = { version = "1", features = ["derive"] }
glam = "0.29"
hecs = "0.10"
image = "0.25"
lazy_static = "1.5.0"
num-traits = "0.2"
pollster = "1.0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wgpu = "30.0.1"
winit = "0.30.13"
